I
# Consumer configuration
spring.kafka.consumer.group-id=my-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Producer configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Optional: enable idempotent producer (safe producer)
spring.kafka.producer.properties.enable.idempotence=true

spring.kafka.listener.missing-topics-fatal=false


# Optional: logging
#logging.level.org.springframework.kafka=INFO
#logging.level.org.apache.kafka=INFO

# Application-level Kafka topics/groups used by producer/consumers
app.kafka.topic.messages=demo-topic
app.kafka.topic.notifications=demo-notification-topic
app.kafka.group.messages=demo-message-consumer-group
app.kafka.group.audit=demo-audit-consumer-group
app.kafka.group.notifications=demo-notification-consumer-group


